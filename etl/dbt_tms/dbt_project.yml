name: tms_dbt
version: "1.0.0"
config-version: 2

profile: tms_oracle

# target-path / log-path se controlan con DBT_TARGET_PATH / DBT_LOG_PATH (env)
# para evitar deprecation warnings en dbt 1.12.
model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
clean-targets: ["dbt_packages"]

on-run-end:
  - "{{ refresh_semantic_layer() }}"

models:
  tms_dbt:
    # Staging: ephemeral (sin objetos en STG_SRC ni en BD)
    staging:
      +materialized: ephemeral
    # Capas destino: MERGE sobre tablas preexistentes (merge_existing, D1)
    edw_3fn:
      +schema: EDW_3FN
      +materialized: merge_existing
    marts:
      +schema: DWH_MART
      dimensions:
        +materialized: merge_existing
      facts:
        +materialized: merge_existing

vars:
  # ST-9: tolerancia de puntualidad de FACT_EVENTOS_PARADA.CONTADOR_PUNTUAL.
  # Una parada es puntual si LAG_LLEGADA_MINUTOS (llegada real - programada) <= tolerancia (adelantos = puntual).
  puntualidad_tolerancia_minutos: 15
  # ST-8: rango calendario de DIM_FECHA y vigencia inicial uniforme de DIM_VEHICULO (A5).
  dim_fecha_inicio: "2026-01-01"
  dim_fecha_fin: "2026-12-31"
  dim_vehiculo_inicio_validez: "2026-08-09"

seeds:
  tms_dbt:
    # Catalogos semilla: se materializan en el esquema propio de ETL_RUNNER
    # y luego se llevan por MERGE a EDW_3FN.
    +quote_columns: false
