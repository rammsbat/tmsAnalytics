table_name: TMS - Indicadores Generales (Dia vs Mes)
main_dttm_col: null
description: Kms totales, rendimiento Kms/kWh, pago casetas, pago operadores y facturacion
  dia vs mes
default_endpoint: null
offset: 0
cache_timeout: null
catalog: null
schema: BI_SEMANTIC
sql: "-- =============================================================================\n\
  -- Dataset   : ds_03_generales_dia_mes.sql\n-- Prop\xF3sito : Bloque 3 \u2014 Indicadores\
  \ Generales (D\xEDa vs. Mes)\n-- Fuente    : docs/Draft-dashboard-TMS.pdf (Bloque\
  \ 3) & draft_dashboard_kpis.md\n-- Patr\xF3n    : Una sola pasada por CTE (rango\
  \ mes) + Agregaci\xF3n condicional para D\xEDa\n-- =============================================================================\n\
  \n{% set from_date = from_dttm[:10] if from_dttm else '2026-11-01' %}\n{% set to_date\
  \ = to_dttm[:10] if to_dttm else '2026-11-06' %}\n{% set ecos = filter_values('CODIGO_ECO')\
  \ or filter_values('UNIDAD') %}\n{% set operadores = filter_values('NOMBRE_OPERADOR')\
  \ or filter_values('OPERADOR') %}\n{% set clientes = filter_values('RAZON_SOCIAL')\
  \ or filter_values('CLIENTE') %}\n\nWITH CTE_CORTE AS (\n    SELECT COALESCE(MAX(FECHA),\
  \ DATE '2026-11-06') AS FECHA_CORTE\n    FROM BI_SEMANTIC.MV_METRICAS_FLOTA_DIARIA\n\
  \    WHERE FECHA >= TO_DATE('{{ from_date }}', 'YYYY-MM-DD')\n      AND FECHA <=\
  \ TO_DATE('{{ to_date }}', 'YYYY-MM-DD')\n),\nCTE_DESPACHOS_GEN AS (\n    SELECT\n\
  \        1                                                                     \
  \                                     AS JOIN_KEY,\n        SUM(CASE WHEN f.FECHA\
  \ = c.FECHA_CORTE THEN d.KMS_TOTAL ELSE 0 END)                                 \
  \        AS TOTAL_KMS_DIA,\n        SUM(d.KMS_TOTAL)                           \
  \                                                                AS TOTAL_KMS_MES,\n\
  \        SUM(CASE WHEN f.FECHA = c.FECHA_CORTE THEN d.KWH_CONSUMO_ENERGIA ELSE 0\
  \ END)                               AS TOTAL_KWH_DIA,\n        SUM(d.KWH_CONSUMO_ENERGIA)\
  \                                                                              \
  \  AS TOTAL_KWH_MES\n    FROM BI_SEMANTIC.VW_FACT_DESPACHO_VIAJE d\n    CROSS JOIN\
  \ CTE_CORTE c\n    JOIN BI_SEMANTIC.VW_DIM_FECHA f \n        ON d.ID_FECHA_INICIO\
  \ = f.ID_FECHA\n    JOIN BI_SEMANTIC.VW_DIM_VEHICULO v \n        ON d.ID_VEHICULO\
  \ = v.ID_VEHICULO\n    JOIN BI_SEMANTIC.VW_DIM_OPERADOR o \n        ON d.ID_OPERADOR\
  \ = o.ID_OPERADOR\n    JOIN BI_SEMANTIC.VW_DIM_CLIENTE cli \n        ON d.ID_CLIENTE_ORIGEN\
  \ = cli.ID_CLIENTE\n    WHERE f.FECHA >= TRUNC(c.FECHA_CORTE, 'MM')\n      AND f.FECHA\
  \ <= c.FECHA_CORTE\n      {% if ecos %}\n      AND v.CODIGO_ECO IN {{ ecos | where_in\
  \ }}\n      {% endif %}\n      {% if operadores %}\n      AND o.NOMBRE_OPERADOR\
  \ IN {{ operadores | where_in }}\n      {% endif %}\n      {% if clientes %}\n \
  \     AND cli.RAZON_SOCIAL IN {{ clientes | where_in }}\n      {% endif %}\n),\n\
  CTE_GASTOS_GEN AS (\n    SELECT\n        1                                     \
  \                                                                 AS JOIN_KEY,\n\
  \        SUM(CASE WHEN f.FECHA = c.FECHA_CORTE THEN g.MONTO_CASETA ELSE 0 END) \
  \                                 AS PAGO_CASETAS_DIA,\n        SUM(g.MONTO_CASETA)\
  \                                                                              \
  \     AS PAGO_CASETAS_MES,\n        SUM(CASE WHEN f.FECHA = c.FECHA_CORTE THEN g.MONTO_OPERADOR\
  \ ELSE 0 END)                                AS PAGO_OPERADORES_DIA,\n        SUM(g.MONTO_OPERADOR)\
  \                                                                              \
  \   AS PAGO_OPERADORES_MES\n    FROM BI_SEMANTIC.VW_FACT_GASTOS_LIQUIDACION g\n\
  \    CROSS JOIN CTE_CORTE c\n    JOIN BI_SEMANTIC.VW_DIM_FECHA f \n        ON g.ID_FECHA_LIQUIDACION\
  \ = f.ID_FECHA\n    JOIN BI_SEMANTIC.VW_DIM_VEHICULO v \n        ON g.ID_VEHICULO\
  \ = v.ID_VEHICULO\n    JOIN BI_SEMANTIC.VW_DIM_OPERADOR o \n        ON g.ID_OPERADOR\
  \ = o.ID_OPERADOR\n    WHERE f.FECHA >= TRUNC(c.FECHA_CORTE, 'MM')\n      AND f.FECHA\
  \ <= c.FECHA_CORTE\n      {% if ecos %}\n      AND v.CODIGO_ECO IN {{ ecos | where_in\
  \ }}\n      {% endif %}\n      {% if operadores %}\n      AND o.NOMBRE_OPERADOR\
  \ IN {{ operadores | where_in }}\n      {% endif %}\n),\nCTE_FACTURACION_GEN AS\
  \ (\n    SELECT\n        1                                                     \
  \                                                            AS JOIN_KEY,\n    \
  \    SUM(CASE WHEN f.FECHA = c.FECHA_CORTE THEN fac.IMPORTE_TOTAL_FACTURADO ELSE\
  \ 0 END)                               AS FACTURADO_DIA,\n        SUM(fac.IMPORTE_TOTAL_FACTURADO)\
  \                                                                              \
  \  AS FACTURADO_MES\n    FROM BI_SEMANTIC.VW_FACT_FACTURACION_FLETE fac\n    CROSS\
  \ JOIN CTE_CORTE c\n    JOIN BI_SEMANTIC.VW_DIM_FECHA f \n        ON fac.ID_FECHA_FACTURACION\
  \ = f.ID_FECHA\n    JOIN BI_SEMANTIC.VW_DIM_VEHICULO v \n        ON fac.ID_VEHICULO\
  \ = v.ID_VEHICULO\n    JOIN BI_SEMANTIC.VW_DIM_CLIENTE cli \n        ON fac.ID_CLIENTE\
  \ = cli.ID_CLIENTE\n    WHERE f.FECHA >= TRUNC(c.FECHA_CORTE, 'MM')\n      AND f.FECHA\
  \ <= c.FECHA_CORTE\n      {% if ecos %}\n      AND v.CODIGO_ECO IN {{ ecos | where_in\
  \ }}\n      {% endif %}\n      {% if clientes %}\n      AND cli.RAZON_SOCIAL IN\
  \ {{ clientes | where_in }}\n      {% endif %}\n)\nSELECT\n    NVL(d.TOTAL_KMS_DIA,\
  \ 0)                                                      AS TOTAL_KMS_DIA,\n  \
  \  NVL(d.TOTAL_KMS_MES, 0)                                                     \
  \ AS TOTAL_KMS_MES,\n    ROUND(NVL(d.TOTAL_KMS_DIA, 0) / NULLIF(NVL(d.TOTAL_KWH_DIA,\
  \ 0), 0), 2)       AS RENDIMIENTO_KMS_KWH_DIA,\n    ROUND(NVL(d.TOTAL_KMS_MES, 0)\
  \ / NULLIF(NVL(d.TOTAL_KWH_MES, 0), 0), 2)       AS RENDIMIENTO_KMS_KWH_MES,\n \
  \   NVL(g.PAGO_CASETAS_DIA, 0)                                                 \
  \  AS PAGO_CASETAS_DIA,\n    NVL(g.PAGO_CASETAS_MES, 0)                        \
  \                           AS PAGO_CASETAS_MES,\n    NVL(g.PAGO_OPERADORES_DIA,\
  \ 0)                                                AS PAGO_OPERADORES_DIA,\n  \
  \  NVL(g.PAGO_OPERADORES_MES, 0)                                               \
  \ AS PAGO_OPERADORES_MES,\n    NVL(fac.FACTURADO_DIA, 0)                       \
  \                             AS FACTURADO_DIA,\n    NVL(fac.FACTURADO_MES, 0) \
  \                                                   AS FACTURADO_MES\nFROM CTE_DESPACHOS_GEN\
  \ d\nFULL OUTER JOIN CTE_GASTOS_GEN g        USING (JOIN_KEY)\nFULL OUTER JOIN CTE_FACTURACION_GEN\
  \ fac USING (JOIN_KEY)\n"
