table_name: TMS - Indicadores Diarios de Flota
main_dttm_col: FECHA_CORTE
description: Indicadores de disponibilidad de unidades (con viaje, sin viaje, inactivas)
  y dona de flota
default_endpoint: null
offset: 0
cache_timeout: null
catalog: null
schema: BI_SEMANTIC
sql: "-- =============================================================================\n\
  -- Dataset   : ds_01_flota_diaria.sql\n-- Prop\xF3sito : Bloque 1 \u2014 Indicadores\
  \ Diarios de Flota (KPIs + Dona de Disponibilidad)\n-- Fuente    : docs/Draft-dashboard-TMS.pdf\
  \ (Bloque 1) & draft_dashboard_kpis.md\n-- Tabla Base: BI_SEMANTIC.VW_FACT_SNAPSHOT_FLOTA_DIARIO\
  \ / VW_DIM_VEHICULO / VW_DIM_FECHA\n-- Filtro    : D\xEDa de corte (por defecto\
  \ to_dttm o '2026-11-06')\n-- =============================================================================\n\
  \n{% set from_date = from_dttm[:10] if from_dttm else '2026-11-01' %}\n{% set to_date\
  \ = to_dttm[:10] if to_dttm else '2026-11-06' %}\n{% set ecos = filter_values('CODIGO_ECO')\
  \ or filter_values('UNIDAD') %}\n\nWITH CTE_CORTE AS (\n    SELECT COALESCE(MAX(FECHA),\
  \ DATE '2026-11-06') AS FECHA_CORTE\n    FROM BI_SEMANTIC.MV_METRICAS_FLOTA_DIARIA\n\
  \    WHERE FECHA >= TO_DATE('{{ from_date }}', 'YYYY-MM-DD')\n      AND FECHA <=\
  \ TO_DATE('{{ to_date }}', 'YYYY-MM-DD')\n)\nSELECT\n    f.FECHA               \
  \                                     AS FECHA_CORTE,\n    CASE\n        WHEN s.UNIDAD_CON_VIAJE_INDICADOR\
  \ = 1 THEN 'Con Viaje'\n        WHEN s.UNIDAD_SIN_VIAJE_INDICADOR = 1 THEN 'Sin\
  \ Viaje'\n        ELSE 'Inactivas'\n    END                                    \
  \                    AS ESTADO_FLOTA,\n    COUNT(s.ID_VEHICULO)                \
  \                       AS CANTIDAD_UNIDADES,\n    ROUND(COUNT(s.ID_VEHICULO) *\
  \ 100.0 / NULLIF(SUM(COUNT(s.ID_VEHICULO)) OVER (), 0), 2) AS PORCENTAJE_FLOTA,\n\
  \    SUM(s.KMS_RECORRIDOS_DIA)                                  AS TOTAL_KMS_DIA,\n\
  \    SUM(s.KWH_CONSUMO_DIA)                                     AS TOTAL_KWH_DIA\n\
  FROM BI_SEMANTIC.VW_FACT_SNAPSHOT_FLOTA_DIARIO s\nCROSS JOIN CTE_CORTE c\nJOIN BI_SEMANTIC.VW_DIM_FECHA\
  \ f\n    ON s.ID_FECHA_CORTE = f.ID_FECHA\nJOIN BI_SEMANTIC.VW_DIM_VEHICULO v\n\
  \    ON s.ID_VEHICULO = v.ID_VEHICULO\nWHERE f.FECHA = c.FECHA_CORTE\n  AND s.ID_VEHICULO\
  \ <> -1\n  {% if ecos %}\n  AND v.CODIGO_ECO IN {{ ecos | where_in }}\n  {% endif\
  \ %}\nGROUP BY\n    f.FECHA,\n    CASE \n        WHEN s.UNIDAD_CON_VIAJE_INDICADOR\
  \ = 1 THEN 'Con Viaje'\n        WHEN s.UNIDAD_SIN_VIAJE_INDICADOR = 1 THEN 'Sin\
  \ Viaje'\n        ELSE 'Inactivas'\n    END\n"
