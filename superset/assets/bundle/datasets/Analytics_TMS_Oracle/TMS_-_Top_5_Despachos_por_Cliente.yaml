table_name: TMS - Top 5 Despachos por Cliente
main_dttm_col: null
description: Ranking de clientes por volumen de despachos y Kms en el dia y acumulado
  mensual
default_endpoint: null
offset: 0
cache_timeout: null
catalog: null
schema: BI_SEMANTIC
sql: "-- =============================================================================\n\
  -- Dataset   : ds_04_top5_clientes.sql\n-- Prop\xF3sito : Bloque 4 \u2014 Top 5\
  \ Despachos por Cliente (D\xEDa vs. Mes)\n-- Fuente    : docs/Draft-dashboard-TMS.pdf\
  \ (Bloque 4) & draft_dashboard_kpis.md\n-- Patr\xF3n    : Una sola pasada por CTE\
  \ (rango mes) + Agregaci\xF3n condicional para D\xEDa\n-- =============================================================================\n\
  \n{% set from_date = from_dttm[:10] if from_dttm else '2026-11-01' %}\n{% set to_date\
  \ = to_dttm[:10] if to_dttm else '2026-11-06' %}\n{% set ecos = filter_values('CODIGO_ECO')\
  \ or filter_values('UNIDAD') %}\n{% set operadores = filter_values('NOMBRE_OPERADOR')\
  \ or filter_values('OPERADOR') %}\n{% set clientes = filter_values('RAZON_SOCIAL')\
  \ or filter_values('CLIENTE') %}\n\nWITH CTE_CORTE AS (\n    SELECT COALESCE(MAX(FECHA),\
  \ DATE '2026-11-06') AS FECHA_CORTE\n    FROM BI_SEMANTIC.MV_METRICAS_FLOTA_DIARIA\n\
  \    WHERE FECHA >= TO_DATE('{{ from_date }}', 'YYYY-MM-DD')\n      AND FECHA <=\
  \ TO_DATE('{{ to_date }}', 'YYYY-MM-DD')\n),\nCTE_CLIENTES AS (\n    SELECT\n  \
  \      cli.RAZON_SOCIAL                                                        \
  \                               AS CLIENTE,\n        cli.RFC_CLIENTE           \
  \                                                                             AS\
  \ RFC,\n        SUM(CASE WHEN f.FECHA = c.FECHA_CORTE THEN d.CONTADOR_DESPACHO ELSE\
  \ 0 END)                            AS DESPACHOS_DIA,\n        SUM(d.CONTADOR_DESPACHO)\
  \                                                                              \
  \ AS DESPACHOS_MES,\n        SUM(d.KMS_TOTAL)                                  \
  \                                                     AS KMS_MES\n    FROM BI_SEMANTIC.VW_FACT_DESPACHO_VIAJE\
  \ d\n    CROSS JOIN CTE_CORTE c\n    JOIN BI_SEMANTIC.VW_DIM_FECHA f \n        ON\
  \ d.ID_FECHA_INICIO = f.ID_FECHA\n    JOIN BI_SEMANTIC.VW_DIM_CLIENTE cli \n   \
  \     ON d.ID_CLIENTE_ORIGEN = cli.ID_CLIENTE\n    JOIN BI_SEMANTIC.VW_DIM_VEHICULO\
  \ v \n        ON d.ID_VEHICULO = v.ID_VEHICULO\n    JOIN BI_SEMANTIC.VW_DIM_OPERADOR\
  \ o \n        ON d.ID_OPERADOR = o.ID_OPERADOR\n    WHERE f.FECHA >= TRUNC(c.FECHA_CORTE,\
  \ 'MM')\n      AND f.FECHA <= c.FECHA_CORTE\n      AND cli.ID_CLIENTE <> -1\n  \
  \    {% if ecos %}\n      AND v.CODIGO_ECO IN {{ ecos | where_in }}\n      {% endif\
  \ %}\n      {% if operadores %}\n      AND o.NOMBRE_OPERADOR IN {{ operadores |\
  \ where_in }}\n      {% endif %}\n      {% if clientes %}\n      AND cli.RAZON_SOCIAL\
  \ IN {{ clientes | where_in }}\n      {% endif %}\n    GROUP BY\n        cli.RAZON_SOCIAL,\n\
  \        cli.RFC_CLIENTE\n)\nSELECT\n    CLIENTE,\n    RFC,\n    DESPACHOS_DIA,\n\
  \    DESPACHOS_MES,\n    KMS_MES\nFROM CTE_CLIENTES\nORDER BY\n    DESPACHOS_MES\
  \ DESC,\n    DESPACHOS_DIA DESC\n"
