# docker-compose.yml - Plataforma Analytics TMS
# Infraestructura: Oracle Free 23ai + PostgreSQL 16 + Valkey 8 + Apache Superset (Thin Mode)

name: analytics-tms

x-superset-common: &superset-common
  image: analytics-tms-superset:local
  build:
    context: .
    dockerfile: superset/Dockerfile
  user: "superset"
  environment:
    SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
    SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
    SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
    SUPERSET_ADMIN_FIRSTNAME: ${SUPERSET_ADMIN_FIRSTNAME:-Admin}
    SUPERSET_ADMIN_LASTNAME: ${SUPERSET_ADMIN_LASTNAME:-User}
    SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@tms.local}
    POSTGRES_DB: ${POSTGRES_DB:-superset}
    POSTGRES_USER: ${POSTGRES_USER:-superset}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_HOST: superset-db
    POSTGRES_PORT: "5432"
    VALKEY_HOST: ${VALKEY_HOST:-superset-valkey}
    VALKEY_PORT: ${VALKEY_PORT:-6379}
    BI_READER_PWD: ${BI_READER_PWD}
  volumes:
    - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
  networks:
    - tms-internal-net
  restart: unless-stopped

services:
  # ---------------------------------------------------------------------------
  # 1. Oracle Database Free (Dev / Staging Local)
  # ---------------------------------------------------------------------------
  oracle-dw:
    image: gvenzl/oracle-free:23-slim
    container_name: tms-oracle-dw
    shm_size: 1g
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PWD}
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./oracle/init:/container-entrypoint-initdb.d:ro
    networks:
      - tms-internal-net
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 2. PostgreSQL 16 (Metastore de Superset)
  # ---------------------------------------------------------------------------
  superset-db:
    image: postgres:16-alpine
    container_name: tms-superset-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-superset}
      POSTGRES_USER: ${POSTGRES_USER:-superset}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tms-internal-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-superset}", "-d", "${POSTGRES_DB:-superset}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 3. Valkey 8 (Caché y Broker Celery - Licencia $0 BSD-3, sin Redis)
  # ---------------------------------------------------------------------------
  superset-valkey:
    image: valkey/valkey:8-alpine
    container_name: tms-superset-valkey
    networks:
      - tms-internal-net
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 4. Apache Superset Web Application
  # ---------------------------------------------------------------------------
  superset-app:
    <<: *superset-common
    container_name: tms-superset-app
    command: ["/bin/bash", "/app/bootstrap.sh"]
    ports:
      - "8088:8088"
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./superset/bootstrap.sh:/app/bootstrap.sh:ro
      - ./superset/assets:/app/assets
    depends_on:
      superset-db:
        condition: service_healthy
      superset-valkey:
        condition: service_healthy
      oracle-dw:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8088/health')\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # 5. Superset Celery Worker (Consultas Asíncronas)
  # ---------------------------------------------------------------------------
  superset-worker:
    <<: *superset-common
    container_name: tms-superset-worker
    command: ["celery", "--app=superset.tasks.celery_app:app", "worker", "-O", "fair", "-c", "2"]
    healthcheck:
      test: ["CMD-SHELL", "celery --app=superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    depends_on:
      superset-app:
        condition: service_healthy
      superset-db:
        condition: service_healthy
      superset-valkey:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 6. Superset Celery Beat (Tareas Programadas)
  # ---------------------------------------------------------------------------
  superset-beat:
    <<: *superset-common
    container_name: tms-superset-beat
    command: ["celery", "--app=superset.tasks.celery_app:app", "beat", "--pidfile", "/tmp/celerybeat.pid", "-s", "/tmp/celerybeat-schedule"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid) || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      superset-app:
        condition: service_healthy
      superset-db:
        condition: service_healthy
      superset-valkey:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 7. Simulador de datos sintéticos (perfil "sim"; escribe solo en STG_SRC)
  #    Uso: docker compose --profile sim run --rm data-simulator python -m src.main --mode backfill --days 90
  # ---------------------------------------------------------------------------
  data-simulator:
    profiles: ["sim"]
    image: analytics-tms-simulator:local
    build:
      context: .
      dockerfile: simulator/Dockerfile
    container_name: tms-data-simulator
    user: "appuser"
    environment:
      ORACLE_DSN: oracle-dw:1521/FREEPDB1
      SIM_WRITER_USER: SIM_WRITER
      SIM_WRITER_PWD: ${SIM_WRITER_PWD}
      STG_DDL_PATH: /contract/02_ddl_stg_src.sql
    networks:
      - tms-internal-net
    depends_on:
      oracle-dw:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import oracledb, yaml, numpy, faker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # ---------------------------------------------------------------------------
  # 8. ELT dbt-oracle (perfil "etl"; ejecuta como ETL_RUNNER)
  #    Uso: docker compose --profile etl run --rm etl-runner dbt debug
  # ---------------------------------------------------------------------------
  etl-runner:
    profiles: ["etl"]
    image: analytics-tms-etl:local
    build:
      context: .
      dockerfile: etl/Dockerfile
    container_name: tms-etl-runner
    user: "appuser"
    environment:
      ORACLE_DSN: oracle-dw:1521/FREEPDB1
      ORACLE_HOST: oracle-dw
      ORACLE_PORT: "1521"
      ORACLE_SERVICE: FREEPDB1
      ETL_RUNNER_USER: ETL_RUNNER
      ETL_RUNNER_PWD: ${ETL_RUNNER_PWD}
    networks:
      - tms-internal-net
    depends_on:
      oracle-dw:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import oracledb, dbt.version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  tms-internal-net:
    driver: bridge

volumes:
  oracle_data:
  postgres_data:
